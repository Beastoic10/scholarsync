spring:
  datasource:
    url: ${SCHOLARSYNC_DB_URL:jdbc:postgresql://localhost:5432/scholarsync}
    username: ${SCHOLARSYNC_DB_USER:scholarsync}
    password: ${SCHOLARSYNC_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
