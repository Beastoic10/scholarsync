spring:
  application:
    name: scholarsync

  # ---- Default profile: H2 in-memory DB for local dev / grading demo ----
  datasource:
    url: jdbc:h2:mem:scholarsync;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

scholarsync:
  jwt:
    secret: "ChangeThisSecretInProduction-ScholarSyncDevSecretKey-32BytesMin"
    expiration-ms: 86400000 # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# ---- Production profile: run with -Dspring.profiles.active=prod ----
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scholarsync}
    username: ${DB_USER:scholarsync}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

scholarsync:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
